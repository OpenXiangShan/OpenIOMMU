stages: [check, build, test, report]

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_PROJECT_ID == $CI_PROJECT_ID'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - when: never

variables:
  GIT_DEPTH: "0"
  IOMMU_CI_WORK: .ci-work/pipeline
  IOMMU_CI_JOBS: "8"
  IOMMU_CI_RUNNER_TAG: bosc-ci
  IOMMU_CI_LIVE_LOG_KIB: "256"

default:
  tags: [x86_64, tcg, "$IOMMU_CI_RUNNER_TAG"]
  interruptible: true

iommu:check:
  stage: check
  timeout: 10m
  script:
    - python3 tests/ci/iommu/ci.py check --work-dir "$IOMMU_CI_WORK"
  artifacts:
    when: always
    expire_in: 14 days
    paths: [.ci-work/pipeline/]

iommu:build:
  stage: build
  timeout: 2h
  dependencies: ["iommu:check"]
  script:
    - python3 tests/ci/iommu/ci.py doctor --work-dir "$IOMMU_CI_WORK"
    - python3 tests/ci/iommu/ci.py build --work-dir "$IOMMU_CI_WORK" --jobs "$IOMMU_CI_JOBS"
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - .ci-work/pipeline/bundle/
      - .ci-work/pipeline/doctor.json
      - .ci-work/pipeline/logs/
      - .ci-work/pipeline/asset-evidence/
      - .ci-work/pipeline/stage-errors/

.iommu:test:
  stage: test
  timeout: 60m
  dependencies: ["iommu:check", "iommu:build"]
  script:
    - python3 tests/ci/iommu/ci.py run --work-dir "$IOMMU_CI_WORK" --group "$IOMMU_CI_GROUP"
  artifacts:
    when: always
    expire_in: 14 days
    paths: [.ci-work/pipeline/results/, .ci-work/pipeline/reports/, .ci-work/pipeline/stage-errors/]
    reports:
      junit: .ci-work/pipeline/reports/*/junit.xml

iommu:rtl:
  extends: .iommu:test
  variables:
    IOMMU_CI_GROUP: rtl

iommu:linux:
  extends: .iommu:test
  variables:
    IOMMU_CI_GROUP: linux

iommu:report:
  stage: report
  timeout: 10m
  when: always
  dependencies: ["iommu:check", "iommu:build", "iommu:rtl", "iommu:linux"]
  script:
    - python3 tests/ci/iommu/ci.py report --work-dir "$IOMMU_CI_WORK"
  artifacts:
    when: always
    expire_in: 30 days
    paths: [.ci-work/pipeline/reports/all/, .ci-work/pipeline/stage-errors/]
    reports:
      junit: .ci-work/pipeline/reports/all/junit.xml
